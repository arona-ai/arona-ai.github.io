<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artifacts</title>
<link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/144466234?s=400&u=a3c692da068148c0a68af8ffcf065fe19fbd9a11&v=4">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #111110; font-family: 'JetBrains Mono', 'Fira Code', monospace; }

  /* ── Toolbar ── */
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 40px;
    background: #1a1917; border-bottom: 1px solid #272522;
    display: flex; align-items: center; gap: 8px; padding: 0 12px; z-index: 100;
  }
  .logo { font-size: 11px; font-weight: 500; letter-spacing: 0.15em; color: #605d58; flex-shrink: 0; }
  .sep  { width: 1px; height: 16px; background: #272522; flex-shrink: 0; }

  /* ── Tabs ── */
  .tabs { display: flex; gap: 2px; flex-shrink: 0; }
  .tab {
    height: 24px; padding: 0 10px; border: 1px solid transparent; border-radius: 5px;
    background: none; color: #605d58; cursor: pointer;
    font-size: 11px; font-family: inherit; letter-spacing: 0.05em;
    display: flex; align-items: center; gap: 5px; transition: all 0.12s;
    white-space: nowrap;
  }
  .tab:hover  { color: #c9c5be; border-color: #272522; }
  .tab.active { color: #e8e5df; border-color: #272522; background: #272522; }
  .tab-icon {
    width: 12px; height: 12px; stroke: currentColor; fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
  }
  .tab-code {
    font-size: 11px; font-family: inherit; letter-spacing: -0.02em; flex-shrink: 0;
  }

  .label  { font-size: 11px; color: #605d58; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 360px; }
  .spacer { flex: 1; }
  .badge  {
    font-size: 9px; letter-spacing: 0.1em; color: #413e39; border: 1px solid #272522;
    border-radius: 4px; padding: 1px 5px; flex-shrink: 0;
  }
  .icon-btn {
    width: 26px; height: 26px; border: 1px solid #272522; border-radius: 5px;
    background: none; color: #605d58; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    text-decoration: none; transition: all 0.12s;
  }
  .icon-btn:hover { color: #e8e5df; border-color: #605d58; }
  .icon-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Content areas ── */
  #frame-wrap, #source-wrap, #data-wrap {
    position: fixed; top: 40px; left: 0; right: 0; bottom: 0;
    display: none;
  }
  #frame-wrap.active, #source-wrap.active, #data-wrap.active { display: block; }

  iframe { width: 100%; height: 100%; border: none; background: #fff; }

  /* ── Source pane ── */
  #source-wrap { overflow: auto; background: #0d0d0c; }
  #source-wrap pre {
    margin: 0; padding: 20px 24px;
    font-family: inherit; font-size: 13px; line-height: 1.65;
    tab-size: 2; min-height: 100%;
    color: #c9c5be;
  }
  #source-wrap code { font-family: inherit !important; }

  /* override hljs bg to match our theme */
  .hljs { background: transparent !important; }

  /* line numbers */
  .ln-wrap { display: flex; }
  .ln-nums {
    padding: 0 16px 0 0; text-align: right; user-select: none;
    color: #3a3835; font-size: 13px; line-height: 1.65; flex-shrink: 0;
    border-right: 1px solid #1e1d1b; margin-right: 20px;
  }
  .ln-code { flex: 1; overflow-x: auto; }

  /* ── Data pane (CSV / JSON) ── */
  #data-wrap { overflow: auto; background: #0d0d0c; padding: 20px 24px; }

  /* JSON */
  #json-out {
    font-family: inherit; font-size: 12.5px; line-height: 1.7;
    white-space: pre; color: #c9c5be;
  }
  .j-key   { color: #7aa4d4; }
  .j-str   { color: #a8c986; }
  .j-num   { color: #d49c6b; }
  .j-bool  { color: #c97b7b; }
  .j-null  { color: #808080; }

  /* CSV table */
  #csv-out { border-collapse: collapse; font-size: 12px; color: #c9c5be; width: 100%; }
  #csv-out th {
    background: #1a1917; color: #e8e5df; font-weight: 600;
    padding: 7px 14px; border: 1px solid #272522;
    text-align: left; position: sticky; top: 0;
  }
  #csv-out td { padding: 5px 14px; border: 1px solid #1e1d1b; }
  #csv-out tr:nth-child(even) td { background: #131211; }
  #csv-out tr:hover td { background: #1e1d1b; }

  /* ── Status overlay ── */
  #status {
    position: fixed; inset: 40px 0 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; font-size: 12px; color: #605d58; pointer-events: none;
  }
  #status.hidden { display: none; }
  #status.error  { color: #c94040; }
  .spinner {
    width: 18px; height: 18px; border: 2px solid #272522;
    border-top-color: #605d58; border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="toolbar">
  <span class="logo">SCHALE</span>
  <div class="sep"></div>

  <div class="tabs">
    <button class="tab active" id="tab-preview" onclick="switchTab('preview')">
      <svg class="tab-icon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="tab" id="tab-source" onclick="switchTab('source')">
      <span class="tab-code">&lt;/&gt;</span>
    </button>
  </div>

  <div class="sep"></div>
  <span class="label" id="url-label"></span>
  <span class="badge" id="type-badge"></span>

  <div class="spacer"></div>

  <button class="icon-btn" id="btn-copy" title="Copy source" onclick="copySource()">
    <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
  </button>
  <a class="icon-btn" id="btn-download" title="Download" download>
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </a>
</div>

<!-- Preview tab -->
<div id="frame-wrap" class="active">
  <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
</div>

<!-- Source tab -->
<div id="source-wrap">
  <pre><div class="ln-wrap"><div class="ln-nums" id="ln-nums"></div><div class="ln-code"><code id="source-code"></code></div></div></pre>
</div>

<!-- Data tab (JSON / CSV) -->
<div id="data-wrap">
  <div id="json-out" style="display:none"></div>
  <table id="csv-out" style="display:none"></table>
</div>

<div id="status"><div class="spinner"></div><span>Loading...</span></div>

<script>
const PROXY = 'https://solitary-frost-fbee.idoldange61.workers.dev/?url=';
const params = new URLSearchParams(location.search);
const url    = params.get('url');
const status = document.getElementById('status');
const frame  = document.getElementById('preview');

let rawContent = '';
let currentTab = 'preview';

// ── ext detection ────────────────────────────────────────────────────────────
function getExt(u) {
  return decodeURIComponent(u).split('?')[0].split('/').pop().split('.').pop().toLowerCase();
}

const PREVIEW_TYPES = {
  html : 'HTML',  htm : 'HTML',
  jsx  : 'React', tsx : 'React',
  md   : 'Markdown',
  mermaid: 'Mermaid', mmd: 'Mermaid',
  svg  : 'SVG',
  json : 'JSON',
  csv  : 'CSV',
  pdf  : 'PDF',
  png:'Image', jpg:'Image', jpeg:'Image', gif:'Image', webp:'Image', bmp:'Image', ico:'Image',
};
const HLJS_LANG = {
  py:'python', js:'javascript', ts:'typescript', jsx:'javascript', tsx:'typescript',
  sh:'bash', bash:'bash', zsh:'bash',
  css:'css', scss:'scss', less:'less',
  json:'json', yaml:'yaml', yml:'yaml', toml:'toml',
  md:'markdown', html:'xml', htm:'xml', xml:'xml',
  sql:'sql', rs:'rust', go:'go', rb:'ruby', java:'java', cs:'csharp',
  cpp:'cpp', c:'c', h:'c', kt:'kotlin', swift:'swift', php:'php',
  r:'r', m:'matlab', lua:'lua', dart:'dart',
  dockerfile: 'dockerfile', makefile: 'makefile',
  txt:'plaintext', log:'plaintext', csv:'plaintext',
};

// ── tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');

  document.getElementById('frame-wrap').classList.remove('active');
  document.getElementById('source-wrap').classList.remove('active');
  document.getElementById('data-wrap').classList.remove('active');

  const ext = getExt(url || '');
  if (tab === 'preview') {
    // data types rendered in data-wrap
    if (['json','csv'].includes(ext)) {
      document.getElementById('data-wrap').classList.add('active');
    } else {
      document.getElementById('frame-wrap').classList.add('active');
    }
  } else {
    document.getElementById('source-wrap').classList.add('active');
  }
}

// ── copy source ───────────────────────────────────────────────────────────────
function copySource() {
  navigator.clipboard.writeText(rawContent).then(() => {
    const btn = document.getElementById('btn-copy');
    btn.style.color = '#a8c986';
    setTimeout(() => btn.style.color = '', 1000);
  });
}

// ── render preview ────────────────────────────────────────────────────────────
function renderPreview(ext, content) {
  if (['png','jpg','jpeg','gif','webp','bmp','ico'].includes(ext)) {
    frame.srcdoc = `<!DOCTYPE html><html><head><style>
      body{margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh}
      img{max-width:100%;max-height:100vh;object-fit:contain}
    </style></head><body><img src="${url}"></body></html>`;
    return;
  }
  if (ext === 'pdf') {
    frame.src = url;
    return;
  }
  if (ext === 'svg') {
    frame.srcdoc = `<!DOCTYPE html><html><head><style>
      body{margin:0;background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
      img{max-width:100%;max-height:100vh}
    </style></head><body>${content}</body></html>`;
    return;
  }
  if (['jsx','tsx'].includes(ext)) {
    frame.srcdoc = `<!DOCTYPE html><html><head>
      <meta charset="UTF-8">
      <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"><\/script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"><\/script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"><\/script>
      <style>body{margin:0;padding:16px;font-family:sans-serif}</style>
      </head><body>
      <div id="root"></div>
      <script type="text/babel">
      ${content}
      const __export=typeof App!=='undefined'?App:(typeof default_export!=='undefined'?default_export:null);
      if(__export)ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(__export));
      <\/script></body></html>`;
    return;
  }
  if (['mermaid','mmd'].includes(ext)) {
    frame.srcdoc = `<!DOCTYPE html><html><head>
      <meta charset="UTF-8">
      <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"><\/script>
      <style>body{background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px}.mermaid{max-width:100%}</style>
      </head><body>
      <div class="mermaid">${content.replace(/</g,'&lt;')}</div>
      <script>mermaid.initialize({startOnLoad:true,theme:'default'})<\/script>
      </body></html>`;
    return;
  }
  if (['md'].includes(ext)) {
    frame.srcdoc = `<!DOCTYPE html><html><head>
      <meta charset="UTF-8">
      <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"><\/script>
      <style>
        body{font-family:-apple-system,sans-serif;max-width:860px;margin:40px auto;padding:0 24px;line-height:1.7;color:#222}
        pre{background:#f4f4f4;padding:12px;border-radius:6px;overflow:auto}
        code{background:#f4f4f4;padding:2px 5px;border-radius:4px;font-family:monospace}
        img{max-width:100%}table{border-collapse:collapse;width:100%}
        th,td{border:1px solid #ddd;padding:8px 12px}th{background:#f8f8f8}
      </style>
      </head><body><div id="md"></div>
      <script>document.getElementById('md').innerHTML=marked.parse(${JSON.stringify(content)})<\/script>
      </body></html>`;
    return;
  }
  if (ext === 'json') {
    renderJSON(content);
    return;
  }
  if (ext === 'csv') {
    renderCSV(content);
    return;
  }
  // default: html / htm or unknown → raw iframe
  frame.srcdoc = content;
}

// ── JSON renderer ─────────────────────────────────────────────────────────────
function colorJSON(val, indent = 0) {
  const pad = '  '.repeat(indent);
  const pad1 = '  '.repeat(indent + 1);
  if (val === null)  return `<span class="j-null">null</span>`;
  if (typeof val === 'boolean') return `<span class="j-bool">${val}</span>`;
  if (typeof val === 'number')  return `<span class="j-num">${val}</span>`;
  if (typeof val === 'string')  return `<span class="j-str">${JSON.stringify(val)}</span>`;
  if (Array.isArray(val)) {
    if (!val.length) return '[]';
    const items = val.map(v => pad1 + colorJSON(v, indent + 1)).join(',\n');
    return `[\n${items}\n${pad}]`;
  }
  if (typeof val === 'object') {
    const keys = Object.keys(val);
    if (!keys.length) return '{}';
    const items = keys.map(k =>
      `${pad1}<span class="j-key">${JSON.stringify(k)}</span>: ${colorJSON(val[k], indent + 1)}`
    ).join(',\n');
    return `{\n${items}\n${pad}}`;
  }
  return String(val);
}

function renderJSON(content) {
  const out = document.getElementById('json-out');
  const tbl = document.getElementById('csv-out');
  tbl.style.display = 'none';
  out.style.display = 'block';
  try {
    const parsed = JSON.parse(content);
    out.innerHTML = colorJSON(parsed);
  } catch(e) {
    out.textContent = content; // show raw if invalid
  }
  document.getElementById('data-wrap').classList.add('active');
  document.getElementById('frame-wrap').classList.remove('active');
}

// ── CSV renderer ──────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  return lines.map(line => {
    const cells = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') { inQ = !inQ; continue; }
      if (c === ',' && !inQ) { cells.push(cur); cur = ''; continue; }
      cur += c;
    }
    cells.push(cur);
    return cells;
  });
}
function renderCSV(content) {
  const out = document.getElementById('json-out');
  const tbl = document.getElementById('csv-out');
  out.style.display = 'none';
  tbl.style.display = 'table';
  tbl.innerHTML = '';
  const rows = parseCSV(content);
  if (!rows.length) return;
  const thead = tbl.createTHead();
  const hrow = thead.insertRow();
  // row number col
  const th0 = document.createElement('th');
  th0.style.cssText = 'color:#3a3835;width:40px;text-align:right';
  th0.textContent = '#';
  hrow.appendChild(th0);
  rows[0].forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    hrow.appendChild(th);
  });
  const tbody = tbl.createTBody();
  rows.slice(1).forEach((row, i) => {
    const tr = tbody.insertRow();
    const td0 = tr.insertCell();
    td0.textContent = i + 1;
    td0.style.cssText = 'color:#3a3835;text-align:right;user-select:none';
    row.forEach(cell => {
      const td = tr.insertCell();
      td.textContent = cell;
    });
  });
  document.getElementById('data-wrap').classList.add('active');
  document.getElementById('frame-wrap').classList.remove('active');
}

// ── Source renderer ───────────────────────────────────────────────────────────
function renderSource(ext, content) {
  const lang = HLJS_LANG[ext] || 'plaintext';
  const codeEl = document.getElementById('source-code');
  const escaped = content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  let highlighted;
  try {
    highlighted = hljs.highlight(content, { language: lang }).value;
  } catch {
    highlighted = escaped;
  }

  codeEl.innerHTML = highlighted;

  // Line numbers
  const lines = content.split('\n');
  const numEl = document.getElementById('ln-nums');
  numEl.textContent = lines.map((_,i) => i + 1).join('\n');
}

// ── Main load ─────────────────────────────────────────────────────────────────
if (!url) {
  status.querySelector('span').textContent = 'No ?url= parameter provided.';
  status.classList.add('error');
  status.querySelector('.spinner').style.display = 'none';
} else {
  const ext      = getExt(url);
  const filename = decodeURIComponent(url).split('?')[0].split('/').pop();
  const typeLabel = PREVIEW_TYPES[ext] || ext.toUpperCase() || 'FILE';

  document.getElementById('url-label').textContent = filename;
  document.getElementById('type-badge').textContent = typeLabel;
  const dlBtn = document.getElementById('btn-download');
  dlBtn.href = url;
  dlBtn.download = filename;
  document.title = filename + ' — SCHALE';

  // Images & PDFs: load directly, no proxy needed
  if (['png','jpg','jpeg','gif','webp','bmp','ico'].includes(ext)) {
    frame.src = url;
    status.classList.add('hidden');
    rawContent = url;
    renderSource(ext, `/* Binary file — source not available */\n/* URL: ${url} */`);
  } else if (ext === 'pdf') {
    frame.src = url;
    status.classList.add('hidden');
    rawContent = url;
    renderSource('txt', `/* PDF file — source not available */\n/* URL: ${url} */`);
  } else {
    fetch(PROXY + encodeURIComponent(url))
      .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
      .then(content => {
        rawContent = content;
        renderSource(ext, content);
        renderPreview(ext, content);
        status.classList.add('hidden');
      })
      .catch(err => {
        status.querySelector('span').textContent = 'Failed to load: ' + err.message;
        status.classList.add('error');
        status.querySelector('.spinner').style.display = 'none';
      });
  }
}
</script>
</body>
</html>
