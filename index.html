<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artifacts</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #111110; font-family: 'JetBrains Mono', monospace; }

  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 40px;
    background: #1a1917; border-bottom: 1px solid #272522;
    display: flex; align-items: center; gap: 8px; padding: 0 12px; z-index: 100;
  }
  .logo { font-size: 11px; font-weight: 500; letter-spacing: 0.15em; color: #605d58; }
  .sep { width: 1px; height: 16px; background: #272522; }
  .label { font-size: 11px; color: #605d58; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px; }
  .spacer { flex: 1; }
  .icon-btn {
    width: 26px; height: 26px; border: 1px solid #272522; border-radius: 5px;
    background: none; color: #605d58; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
    text-decoration: none; transition: all 0.12s;
  }
  .icon-btn:hover { color: #e8e5df; border-color: #605d58; }

  #frame-wrap { position: fixed; top: 40px; left: 0; right: 0; bottom: 0; }
  iframe { width: 100%; height: 100%; border: none; background: #fff; }

  #status {
    position: fixed; inset: 40px 0 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: #605d58;
  }
  #status.hidden { display: none; }
  #status.error { color: #c94040; }
</style>
</head>
<body>

<div id="toolbar">
  <span class="logo">SCHALE</span>
  <div class="sep"></div>
  <span class="label" id="url-label"></span>
  <div class="spacer"></div>
  <a class="icon-btn" id="btn-open" title="Open original" target="_blank">↗</a>
</div>

<div id="frame-wrap">
  <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-popups"></iframe>
</div>

<div id="status">Loading...</div>

<script>
  const params = new URLSearchParams(location.search);
  const url = params.get('url');
  const status = document.getElementById('status');
  const frame = document.getElementById('preview');

  if (!url) {
    status.textContent = 'No ?url= parameter provided.';
    status.classList.add('error');
  } else {
    const filename = decodeURIComponent(url).split('?')[0].split('/').pop();
    document.getElementById('url-label').textContent = filename;
    document.getElementById('btn-open').href = url;

    const decodedUrl = decodeURIComponent(url).split('?')[0];
    const isMarkdown = decodedUrl.endsWith('.md');
    const isMermaid = decodedUrl.endsWith('.mermaid');
    const isJsx = decodedUrl.endsWith('.jsx');

    fetch('https://solitary-frost-fbee.idoldange61.workers.dev/?url=' + encodeURIComponent(url))
      .then(res => {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(content => {
        if (isJsx) {
          frame.srcdoc = `<!DOCTYPE html><html><head>
            <meta charset="UTF-8">
            <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"><\/script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"><\/script>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"><\/script>
            <style>body{margin:0;padding:16px;font-family:sans-serif}</style>
            </head><body>
            <div id="root"></div>
            <script type="text/babel">
            ${content}
            const __export = typeof App !== 'undefined' ? App : (typeof default_export !== 'undefined' ? default_export : null);
            if (__export) ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(__export));
            <\/script>
            </body></html>`;
          status.classList.add('hidden');
        } else if (isMermaid) {
          frame.srcdoc = `<!DOCTYPE html><html><head>
            <meta charset="UTF-8">
            <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"><\/script>
            <style>body{background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box}.mermaid{max-width:100%}</style>
            </head><body>
            <div class="mermaid">${content.replace(/</g,'&lt;')}</div>
            <script>mermaid.initialize({startOnLoad:true,theme:'default'})<\/script>
            </body></html>`;
          status.classList.add('hidden');
        } else if (isMarkdown) {
          frame.srcdoc = `<!DOCTYPE html><html><head>
            <meta charset="UTF-8">
            <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"><\/script>
            <style>body{font-family:sans-serif;max-width:860px;margin:40px auto;padding:0 24px;line-height:1.6;color:#222}pre{background:#f4f4f4;padding:12px;border-radius:6px;overflow:auto}code{background:#f4f4f4;padding:2px 5px;border-radius:4px}img{max-width:100%}</style>
            </head><body><div id="md"></div>
            <script>document.getElementById('md').innerHTML=marked.parse(${JSON.stringify(content)})<\/script>
            </body></html>`;
        } else {
          frame.srcdoc = content;
        }
        status.classList.add('hidden');
      })
      .catch(err => {
        status.textContent = 'Failed to load: ' + err.message;
        status.classList.add('error');
      });
  }
</script>
</body>
</html>
